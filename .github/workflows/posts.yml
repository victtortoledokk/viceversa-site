name: Publicar posts (Issues + X -> site)

on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, deleted]
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

concurrency:
  group: publicar-posts
  cancel-in-progress: false

permissions:
  contents: write
  issues: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Ler as Issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python automacao/posts.py

      - name: Tentar ler os posts do X
        continue-on-error: true
        run: python automacao/ler-x.py

      - name: Regerar o site
        run: python montar.py

      - name: Publicar
        run: |
          git config user.name "viceversa-bot"
          git config user.email "bot@viceversa"
          git add feed.json docs/
          if git diff --cached --quiet; then
            echo "nada mudou, nada a publicar."
            exit 0
          fi
          git commit -m "posts: atualiza o painel de noticias"
          for tentativa in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              echo "publicado."
              exit 0
            fi
            echo "tentativa $tentativa falhou; repetindo em 5s..."
            sleep 5
          done
          echo "nao consegui publicar apos 3 tentativas."
          exit 1
